# The router inside a confidential VM, reached by its own name: dstack-ingress obtains the
# certificate for DOMAIN with Let's Encrypt (DNS-01 through the Cloudflare API) and terminates TLS
# INSIDE the measured VM, so the private key of router.lebrel.ai never exists outside it; it then
# forwards to the router. The dstack gateway hostname (port 8080) keeps working beside it, which is
# how a verifier reaches the machine without trusting DNS. Everything here is measured, the ingress
# image pinned by digest; CLOUDFLARE_API_TOKEN (Zone:Read + DNS:Edit on the zone, nothing else) and
# CERTBOT_EMAIL travel as dstack encrypted environment variables.
services:
  router:
    image: ghcr.io/lebrel-ai/router@sha256:b31316b3d211ded8cf320a87f8c02334f787cd0b9113560274e98eeb8800345a
    restart: unless-stopped
    ports:
      - "8080:8090"
    volumes:
      - router-state:/var/lib/lebrel-router
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      # Measured, public.
      - ENVIRONMENT=production
      - LISTEN_ADDR=:8090
      - ROUTES_FILE=/etc/lebrel-router/routes.json
      - CONTROL_PLANE_URL=https://lebrel.ai
      - BOARD_SOURCE=https://models.lebrel.ai/v1/watch
      - BOARD_URL=https://models.lebrel.ai/watch
      - BOARD_REFRESH_SECONDS=300
      - BOARD_PUBLIC_KEY_HEX=536a6eaa6c97091b653519008b0ffc1d76e5e32067b36f3802c7574aebf498c4
      - MAX_REQUEST_BYTES=33554432
      - SETTLEMENT_CONCURRENCY=8
      - SETTLEMENT_ALERT_SECONDS=5
      - SHUTDOWN_SECONDS=600
      # Encrypted at deploy time, released by the KMS to this measurement only.
      - INSTANCE_ID=${INSTANCE_ID}
      - CONTROL_PLANE_SECRET=${CONTROL_PLANE_SECRET}
      - EDGE_PROXY_SECRET=${EDGE_PROXY_SECRET}
      - HEALTH_TOKEN=${HEALTH_TOKEN}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - ZAI_API_KEY=${ZAI_API_KEY}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
  ingress:
    image: dstacktee/dstack-ingress:2.2@sha256:d05a7b343c37c1cca1bba8dbf7e8f3c6d2118158af2d41c455103796db4f67f0
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      - DOMAIN=router-tee.lebrel.ai
      - TARGET_ENDPOINT=router:8090
      - GATEWAY_DOMAIN=gateway.${DSTACK_GATEWAY_DOMAIN}
      - SET_CAA=true
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
      - cert-data:/etc/letsencrypt
      - evidences:/evidences
volumes:
  router-state:
  cert-data:
  evidences:
